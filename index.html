<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Raga-Vibe Experiments</title>
<style>
  :root { --bg: #0a0a0f; --surface: #15151e; --primary: #00f0ff; --secondary: #bd00ff; --text: #e0e0e0; --text-dim: #888; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
  
  .hub { padding: 2rem; max-width: 1200px; margin: 0 auto; animation: fadeIn 0.4s ease; }
  .hub-header { text-align: center; margin-bottom: 2rem; }
  .hub-header h1 { font-size: 2rem; margin: 0 0 0.5rem 0; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hub-header p { color: var(--text-dim); margin: 0; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
  .card { background: var(--surface); border: 1px solid #2a2a35; border-radius: 12px; padding: 1.5rem; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
  .card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 8px 24px rgba(0, 240, 255, 0.1); }
  .card-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; color: #fff; }
  .card-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; }

  .exp-view { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: none; flex-direction: column; animation: slideUp 0.3s ease; }
  .exp-view.active { display: flex; }
  .exp-header { display: flex; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid #2a2a35; background: var(--surface); }
  .back-btn { background: transparent; border: 1px solid #444; color: var(--text); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
  .back-btn:hover { background: #2a2a35; border-color: var(--primary); color: var(--primary); }
  .exp-title { margin-left: 1rem; font-size: 1.2rem; font-weight: 600; }
  .exp-stage { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; }
  
  .footer { text-align: center; padding: 2rem; color: #555; font-size: 0.85rem; border-top: 1px solid #1a1a25; margin-top: 2rem; }
  .footer a { color: var(--primary); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* Utility for experiments */
  .exp-canvas { touch-action: none; display: block; }
  .exp-btn { background: var(--primary); color: #000; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; margin: 0.5rem; transition: opacity 0.2s; }
  .exp-btn:hover { opacity: 0.9; }
  .exp-input { background: #222; border: 1px solid #444; color: #fff; padding: 0.5rem; border-radius: 4px; width: 100%; max-width: 300px; margin: 0.5rem 0; }
  .exp-textarea { background: #222; border: 1px solid #444; color: #fff; padding: 0.5rem; border-radius: 4px; width: 100%; max-width: 500px; height: 150px; margin: 0.5rem 0; font-family: monospace; resize: vertical; }
  .exp-slider { width: 100%; max-width: 300px; margin: 1rem 0; accent-color: var(--primary); }
</style>
</head>
<body>

<div id="hub" class="hub">
  <div class="hub-header">
    <h1>Raga-Vibe Experiments</h1>
    <p>30 Interactive Creative Tools & Simulations</p>
  </div>
  <div class="grid" id="card-grid"></div>
  <div class="footer">
    Crafted by <strong>Raga-Vibe</strong> &bull; <a href="https://github.com/Raga-Vibe" target="_blank">github.com/Raga-Vibe</a> &bull; <a href="https://twitter.com/RagaCrypt" target="_blank">@RagaCrypt</a>
  </div>
</div>

<div id="exp-view" class="exp-view">
  <div class="exp-header">
    <button class="back-btn" onclick="App.close()">← Back</button>
    <div class="exp-title" id="exp-title">Experiment</div>
  </div>
  <div class="exp-stage" id="exp-stage"></div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
const App = {
  currentCleanup: null,
  open(id) {
    const exp = experiments.find(e => e.id === id);
    if (!exp) return;
    $('#hub').style.display = 'none';
    $('#exp-view').classList.add('active');
    $('#exp-title').textContent = exp.title;
    const stage = $('#exp-stage');
    stage.innerHTML = '';
    this.currentCleanup = exp.init(stage);
    window.location.hash = `exp-${id}`;
  },
  close() {
    if (this.currentCleanup) this.currentCleanup();
    this.currentCleanup = null;
    $('#exp-stage').innerHTML = '';
    $('#exp-view').classList.remove('active');
    $('#hub').style.display = 'block';
    window.location.hash = '';
  }
};

window.addEventListener('hashchange', () => {
  const hash = window.location.hash;
  if (hash.startsWith('#exp-')) {
    const id = parseInt(hash.split('-')[1]);
    if (!$('#exp-view').classList.contains('active')) App.open(id);
  } else {
    if ($('#exp-view').classList.contains('active')) App.close();
  }
});

const experiments = [
  { id: 1, title: "Particle Gravity", icon: "🌌", desc: "Move your cursor to attract glowing particles.",
    init: (c) => {
      const canvas = document.createElement('canvas'); canvas.className = 'exp-canvas'; canvas.width = c.clientWidth; canvas.height = c.clientHeight; c.appendChild(canvas);
      const ctx = canvas.getContext('2d'); let pts = [], mx = canvas.width/2, my = canvas.height/2;
      for(let i=0;i<150;i++) pts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx:0, vy:0});
      const move = e => { const r = canvas.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; };
      canvas.addEventListener('mousemove', move); canvas.addEventListener('touchmove', e => { e.preventDefault(); move(e.touches[0]); }, {passive:false});
      let anim; const loop = () => {
        ctx.fillStyle = 'rgba(10,10,15,0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        pts.forEach(p => {
          let dx = mx - p.x, dy = my - p.y, dist = Math.sqrt(dx*dx+dy*dy) || 1;
          p.vx += (dx/dist)*0.8; p.vy += (dy/dist)*0.8; p.vx *= 0.92; p.vy *= 0.92;
          p.x += p.vx; p.y += p.vy;
          ctx.fillStyle = `hsl(${dist*2}, 100%, 60%)`; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
        });
        anim = requestAnimationFrame(loop);
      }; loop();
      return () => { cancelAnimationFrame(anim); canvas.remove(); };
    }
  },
  { id: 2, title: "Neon Synth", icon: "🎹", desc: "Touch or click keys to play web audio tones.",
    init: (c) => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const wrap = document.createElement('div'); wrap.style.cssText = "display:flex;height:60%;width:90%;gap:4px;";
      const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
      notes.forEach((freq) => {
        const key = document.createElement('div');
        key.style.cssText = "flex:1; background:#222; border-radius:4px; cursor:pointer; transition:background 0.1s; border:1px solid #333;";
        const play = () => {
          if(ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = freq; gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start(); osc.stop(ctx.currentTime + 0.5);
          key.style.background = '#00f0ff'; setTimeout(() => key.style.background = '#222', 200);
        };
        key.addEventListener('mousedown', play); key.addEventListener('touchstart', (e)=>{e.preventDefault(); play();}, {passive:false});
        wrap.appendChild(key);
      });
      c.appendChild(wrap);
      return () => { ctx.close(); wrap.remove(); };
    }
  },
  { id: 3, title: "Game of Life", icon: "🦠", desc: "Classic cellular automaton. Click to toggle cells.",
    init: (c) => {
      const size = 15, cols = Math.floor(c.clientWidth/size), rows = Math.floor(c.clientHeight/size);
      let grid = Array(cols).fill().map(() => Array(rows).fill(0).map(() => Math.random() > 0.85 ? 1 : 0));
      const canvas = document.createElement('canvas'); canvas.className = 'exp-canvas'; canvas.width = cols*size; canvas.height = rows*size; c.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      const draw = () => {
        ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#00ff9d';
        for(let i=0; i<cols; i++) for(let j=0; j<rows; j++) if(grid[i][j]) ctx.fillRect(i*size, j*size, size-1, size-1);
      };
      const update = () => {
        const next = Array(cols).fill().map(() => Array(rows).fill(0));
        for(let i=0; i<cols; i++) for(let j=0; j<rows; j++) {
          let n = 0;
          for(let x=-1; x<=1; x++) for(let y=-1; y<=1; y++) {
            if(x===0 && y===0) continue;
            n += grid[(i+x+cols)%cols][(j+y+rows)%rows];
          }
          next[i][j] = grid[i][j] ? (n===2 || n===3 ? 1 : 0) : (n===3 ? 1 : 0);
        }
        grid = next; draw();
      };
      const interval = setInterval(update, 80); draw();
      const click = e => {
        const r = canvas.getBoundingClientRect();
        grid[Math.floor((e.clientX - r.left)/size)][Math.floor((e.clientY - r.top)/size)] ^= 1; draw();
      };
      canvas.addEventListener('click', click);
      return () => { clearInterval(interval); canvas.removeEventListener('click', click); canvas.remove(); };
    }
  },
  { id: 4, title: "Breathing Guide", icon: "🧘", desc: "Ambient animation for relaxation and focus.",
    init: (c) => {
      const div = document.createElement('div'); div.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;";
      const circle = document.createElement('div'); circle.style.cssText = "width:120px;height:120px;border-radius:50%;background:#bd00ff;transition:transform 4s ease-in-out, background 4s;box-shadow:0 0 30px rgba(189,0,255,0.3);";
      const text = document.createElement('div'); text.style.cssText = "margin-top:2rem;color:#fff;font-size:1.5rem;font-weight:300;letter-spacing:2px;";
      div.appendChild(circle); div.appendChild(text); c.appendChild(div);
      let active = true, state = 0, timer;
      const cycle = () => {
        if(!active) return;
        if(state === 0) { circle.style.transform = "scale(2.2)"; circle.style.background = "#00f0ff"; text.textContent = "Breathe In"; state = 1; timer = setTimeout(cycle, 4000); }
        else if(state === 1) { text.textContent = "Hold"; state = 2; timer = setTimeout(cycle, 2000); }
        else { circle.style.transform = "scale(1)"; circle.style.background = "#bd00ff"; text.textContent = "Breathe Out"; state = 0; timer = setTimeout(cycle, 4000); }
      };
      cycle();
      return () => { active = false; clearTimeout(timer); div.remove(); };
    }
  },
  { id: 5, title: "Typing Rain", icon: "⌨️", desc: "Type on your keyboard to spawn falling characters.",
    init: (c) => {
      const canvas = document.createElement('canvas'); canvas.className = 'exp-canvas'; canvas.width = c.clientWidth; canvas.height = c.clientHeight; c.appendChild(canvas);
      const ctx = canvas.getContext('2d'); let drops = [];
      const onKey = e => {
        drops.push({x: Math.random()*canvas.width, y: 0, char: e.key.length === 1 ? e.key : String.fromCharCode(65+Math.random()*26), speed: 2+Math.random()*3, color: `hsl(${Math.random()*360},80%,60%)`});
      };
      window.addEventListener('keydown', onKey);
      let anim; const loop = () => {
        ctx.fillStyle = 'rgba(10,10,15,0.3)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.font = '16px monospace';
        drops = drops.filter(d => {
          d.y += d.speed;
          ctx.fillStyle = d.color; ctx.fillText(d.char, d.x, d.y);
          return d.y < canvas.height;
        });
        anim = requestAnimationFrame(loop);
      }; loop();
      return () => { cancelAnimationFrame(anim); window.removeEventListener('keydown', onKey); canvas.remove(); };
    }
  },
  { id: 6, title: "Fractal Tree", icon: "🌳", desc: "Adjust the slider to grow a recursive fractal tree.",
    init: (c) => {
      const wrap = document.createElement('div'); wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;width:100%;height:100%;";
      const canvas = document.createElement('canvas'); canvas.className = 'exp-canvas'; canvas.width = Math.min(500, c.clientWidth); canvas.height = Math.min(500, c.clientHeight); wrap.appendChild(canvas);
      const slider = document.createElement('input'); slider.type = 'range'; slider.min = '10'; slider.max = '45'; slider.value = '25'; slider.className = 'exp-slider'; wrap.appendChild(slider);
      const ctx = canvas.getContext('2d');
      const draw = () => {
        ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0,0,canvas.width,canvas.height);
        const branch = (x, y, len, angle, depth) => {
          if(depth === 0) return;
          const ex = x + len * Math.cos(angle), ey = y + len * Math.sin(angle);
          ctx.strokeStyle = `hsl(${120 + depth*10}, 70%, ${50 + depth*5}%)`; ctx.lineWidth = depth * 0.8;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
          const ang = parseFloat(slider.value) * Math.PI / 180;
          branch(ex, ey, len * 0.7, angle - ang, depth - 1);
          branch(ex, ey, len * 0.7, angle + ang, depth - 1);
        };
        branch(canvas.width/2, canvas.height, canvas.height/4, -Math.PI/2, 10);
      };
      slider.addEventListener('input', draw); draw();
      return () => { wrap.remove(); };
    }
  },
  { id: 7, title: "Color Mixer", icon: "🎨", desc: "Mix RGB values to find your perfect hex color.",
    init: (c) => {
      const wrap = document.createElement('div'); wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:1rem;";
      const preview = document.createElement('div'); preview.style.cssText = "width:200px;height:200px;border-radius:12px;border:2px solid #333;transition:background 0.2s;";
      const hex = document.createElement('div'); hex.style.cssText = "font-size:1.5rem;font-family:monospace;color:#fff;";
      wrap.appendChild(preview); wrap.appendChild(hex);
      ['red','green','blue'].forEach((color, i) => {
        const row = document.createElement('div'); row.style.cssText = "display:flex;align-items:center;gap:10px;width:300px;";
        const label = document.createElement('span'); label.textContent = color[0].toUpperCase(); label.style.cssText = "width:20px;color:#fff;";
        const input = document.createElement('input'); input.type = 'range'; input.min = 0; input.max = 255; input.value = 128; input.className = 'exp-slider'; input.style.margin = '0'; input.style.flex = '1';
        input.dataset.channel = color;
        const val = document.createElement('span'); val.style.cssText = "width:30px;text-align:right;color:#888;"; val.textContent = input.value;
        input.addEventListener('input', () => { val.textContent = input.value; update(); });
        row.append(label, input, val); wrap.appendChild(row);
      });
      c.appendChild(wrap);
      const update = () => {
        const r = wrap.querySelector('[data-channel=red]').value;
        const g = wrap.querySelector('[data-channel=green]').value;
        const b = wrap.querySelector('[data-channel=blue]').value;
        const hexStr = `#${[r,g,b].map(x=>parseInt(x).toString(16).padStart(2,'0')).join('')}`;
        preview.style.background = `rgb(${r},${g},${b})`; hex.textContent = hexStr.toUpperCase();
      };
      update();
      return () => { wrap.remove(); };
    }
  },
  { id: 8, title: "Bouncing Logo", icon: "📀", desc: "The classic screensaver, bouncing endlessly.",
    init: (c) => {
      const el = document.createElement('div'); el.textContent = 'RAGA'; el.style.cssText = "position:absolute;font-weight:900;font-size:2rem;color:#00f0ff;white-space:nowrap;";
      c.appendChild(el);
      let x = 10, y = 10, dx = 3, dy = 3;
      const colors = ['#00f0ff', '#bd00ff', '#00ff9d', '#ff0055', '#ffff00'];
      let anim; const loop = () => {
        const w = c.clientWidth, h = c.clientHeight, ew = el.offsetWidth, eh = el.offsetHeight;
        if(x <= 0 || x + ew >= w) { dx = -dx; el.style.color = colors[Math.floor(Math.random()*colors.length)]; }
        if(y <= 0 || y + eh >= h) { dy = -dy; el.style.color = colors[Math.floor(Math.random()*colors.length)]; }
        x += dx; y += dy;
        el.style.transform = `translate(${x}px, ${y}px)`;
        anim = requestAnimationFrame(loop);
      }; loop();
      return () => { cancelAnimationFrame(anim); el.remove(); };
    }
  },
  { id: 9, title: "Reaction Time", icon: "⚡", desc: "Click as fast as you can when the screen turns green.",
    init: (c) => {
      const el = document.createElement('div'); el.style.cssText = "width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:#222;color:#fff;font-size:1.5rem;text-align:center;padding:2rem;";
      el.innerHTML = "<div>Click to Start</div>"; c.appendChild(el);
      let state = 'idle', start, timeout;
      const click = () => {
        if(state === 'idle') {
          state = 'waiting'; el.style.background = '#bd00ff'; el.innerHTML = "<div>Wait for Green...</div>";
          timeout = setTimeout(() => { state = 'ready'; start = Date.now(); el.style.background = '#00ff9d'; el.innerHTML = "<div>CLICK NOW!</div>"; }, 1000 + Math.random()*3000);
        } else if(state === 'waiting') {
          clearTimeout(timeout); state = 'idle'; el.style.background = '#ff0055'; el.innerHTML = "<div>Too Early! Click to retry.</div>";
        } else if(state === 'ready') {
          const ms = Date.now() - start; state = 'idle'; el.style.background = '#222'; el.innerHTML = `<div>${ms} ms</div><div style='font-size:1rem;margin-top:1rem;color:#888'>Click to retry</div>`;
        }
      };
      el.addEventListener('click', click);
      return () => { clearTimeout(timeout); el.removeEventListener('click', click); el.remove(); };
    }
  },
  { id: 10, title: "Maze Generator", icon: "🕸️", desc: "Procedurally generated maze using recursive backtracking.",
    init: (c) => {
      const size = 20, cols = Math.floor(c.clientWidth/size), rows = Math.floor(c.clientHeight/size);
      const canvas = document.createElement('canvas'); canvas.className = 'exp-canvas'; canvas.width = cols*size; canvas.height = rows*size; c.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      const grid = Array(cols).fill().map(() => Array(rows).fill().map(() => ({top:true, right:true, bottom:true, left:true, visited:false})));
      const stack = [{x:0, y:0}]; grid[0][0].visited = true;
      while(stack.length > 0) {
        const curr = stack[stack.length-1];
        const neighbors = [];
        [[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy], i) => {
          const nx = curr.x+dx, ny = curr.y+dy;
          if(nx>=0 && nx<cols && ny>=0 && ny<rows && !grid[nx][ny].visited) neighbors.push({x:nx, y:ny, dir:i});
        });
        if(neighbors.length > 0) {
          const next = neighbors[Math.floor(Math.random()*neighbors.length)];
          grid[curr.x][curr.y][['top','right','bottom','left'][next.dir]] = false;
          grid[next.x][next.y][['bottom','left','top','right'][next.dir]] = false;
          grid[next.x][next.y].visited = true;
          stack.push({x:next.x, y:next.y});
        } else { stack.pop(); }
      }
      ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.beginPath();
      for(let x=0; x<cols; x++) for(let y=0; y<rows; y++) {
        const cx = x*size, cy = y*size;
        if(grid[x][y].top) { ctx.moveTo(cx, cy); ctx.lineTo(cx+size, cy); }
        if(grid[x][y].right) { ctx.moveTo(cx+size, cy); ctx.lineTo(cx+size, cy+size); }
        if(grid[x][y].bottom) { ctx.moveTo(cx, cy+size); ctx.lineTo(cx+size, cy+size); }
        if(grid[x][y].left) { ctx.moveTo(cx, cy); ctx.lineTo(cx, cy+size); }
      }
      ctx.stroke();
      return () => { canvas.remove(); };
    }
  },
  { id: 11, title: "Wave Visualizer", icon: "🌊", desc: "Move your mouse to modulate sine wave frequencies.",
    init: (c) => {
      const canvas = document.createElement('canvas'); canvas.className = 'exp-canvas'; canvas.width = c.clientWidth; canvas.height = c.clientHeight; c.appendChild(canvas);
      const ctx = canvas.getContext('2d'); let mx = 0.5, my = 0.5;
      const move = e => { const r = canvas.getBoundingClientRect(); mx = (e.clientX - r.left)/canvas.width; my = (e.clientY - r.top)/canvas.height; };
      canvas.addEventListener('mousemove', move); canvas.addEventListener('touchmove', e => { e.preventDefault(); move(e.touches[0]); }, {passive:false});
      let time = 0, anim;
      const loop = () => {
        ctx.fillStyle = 'rgba(10,10,15,0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.beginPath(); ctx.strokeStyle = `hsl(${time*50}, 80%, 60%)`; ctx.lineWidth = 3;
        for(let x=0; x<canvas.width; x+=5) {
          const y = canvas.height/2 + Math.sin(x*0.01 + time*2) * (my * 150) + Math.sin(x*0.02 - time) * (mx * 50);
          x === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        }
        ctx.stroke(); time += 0.05; anim = requestAnimationFrame(loop);
      }; loop();
      return () => { cancelAnimationFrame(anim); canvas.remove(); };
    }
  },
  { id: 12, title: "Gravity Balls", icon: "🎱", desc: "Click or tap to spawn bouncing physics balls.",
    init: (c) => {
      const canvas = document.createElement('canvas'); canvas.className = 'exp-canvas'; canvas.width = c.clientWidth; canvas.height = c.clientHeight; c.appendChild(canvas);
      const ctx = canvas.getContext('2d'); let balls = [];
      const spawn = e => {
        const r = canvas.getBoundingClientRect();
        for(let i=0;i<5;i++) balls.push({x: e.clientX-r.left, y: e.clientY-r.top, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, r: 5+Math.random()*10, color: `hsl(${Math.random()*360},80%,60%)`});
      };
      canvas.addEventListener('mousedown', spawn); canvas.addEventListener('touchstart', e => { e.preventDefault(); spawn(e.touches[0]); }, {passive:false});
      let anim; const loop = () => {
        ctx.fillStyle = 'rgba(10,10,15,0.3)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        balls.forEach(b => {

        const options = input.value.split('\n').filter(x => x.trim());
        if(options.length < 2) return;
        let i = 0, speed = 50;
        clearInterval(timer);
        const spin = () => {
          result.textContent = options[i % options.length];
          i++;
          if(speed < 400) speed *= 1.1;
          if(speed > 300) { result.style.transform = "scale(1.2)"; setTimeout(()=>result.style.transform="scale(1)", 200); return; }
          timer = setTimeout(spin, speed);
        };
        spin();
      });
      return () => { clearTimeout(timer); wrap.remove(); };
    }
  },
  { id: 30, title: "Zen Garden", icon: "🎋", desc: "Click to create calming, fading ripples in the sand.",
    init: (c) => {
      const canvas = document.createElement('canvas'); canvas.className = 'exp-canvas'; canvas.width = c.clientWidth; canvas.height = c.clientHeight; c.appendChild(canvas);
      const ctx = canvas.getContext('2d'); let ripples = [];
      const click = e => {
        const r = canvas.getBoundingClientRect();
        ripples.push({x: e.clientX - r.left, y: e.clientY - r.top, radius: 0, alpha: 1});
      };
      canvas.addEventListener('mousedown', click); canvas.addEventListener('touchstart', e => { e.preventDefault(); click(e.touches[0]); }, {passive:false});
      let anim; const loop = () => {
        ctx.fillStyle = 'rgba(10,10,15,0.1)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ripples = ripples.filter(r => {
          r.radius += 2; r.alpha -= 0.01;
          ctx.strokeStyle = `rgba(0, 240, 255, ${r.alpha})`; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI*2); ctx.stroke();
          return r.alpha > 0;
        });
        anim = requestAnimationFrame(loop);
      }; loop();
      return () => { cancelAnimationFrame(anim); canvas.remove(); };
    }
  }
];

// Initialize Hub
const grid = $('#card-grid');
experiments.forEach(exp => {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<div class="card-icon">${exp.icon}</div><div class="card-title">${exp.title}</div><div class="card-desc">${exp.desc}</div>`;
  card.addEventListener('click', () => App.open(exp.id));
  grid.appendChild(card);
});

// Handle initial hash
if(window.location.hash.startsWith('#exp-')) {
  const id = parseInt(window.location.hash.split('-')[1]);
  App.open(id);
}
