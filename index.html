<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#0a0a14" />
<title>Raga-Vibe · 30 Experiments</title>
<style>
/* =========================================================
   DESIGN SYSTEM — Dark Ambient / Neon Glass
   ========================================================= */
:root {
  --bg: #0a0a14;
  --bg-soft: #12121f;
  --bg-glass: rgba(255,255,255,0.04);
  --fg: #e9ecff;
  --fg-dim: #8a8fb5;
  --border: rgba(255,255,255,0.08);
  --accent-1: #ff4d9d; /* generative art */
  --accent-2: #00e5c7; /* audio */
  --accent-3: #ffd166; /* games */
  --accent-4: #7c5cff; /* ambient */
  --accent-5: #3aa6ff; /* sims */
  --accent-6: #ff8a3d; /* data-viz */
  --accent-7: #9be36d; /* text/creative */
  --shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
  --radius: 16px;
  --radius-sm: 10px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body {
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,0.12), transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, rgba(255,77,157,0.08), transparent 60%),
    radial-gradient(900px 500px at 50% 110%, rgba(0,229,199,0.08), transparent 60%),
    var(--bg);
  min-height: 100vh;
}
a { color: inherit; }
button {
  font-family: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.25s var(--ease);
  font-size: 14px;
  touch-action: manipulation;
}
button:hover { background: var(--bg-glass); transform: translateY(-1px); }
button:active { transform: translateY(0); }
button.primary {
  background: linear-gradient(135deg, var(--accent-4), var(--accent-1));
  border-color: transparent;
  color: #0b0b16;
  font-weight: 600;
}
input, select, textarea {
  font-family: inherit;
  background: var(--bg-glass);
  color: var(--fg);
  border: 1px solid var(--border);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-4); outline-offset: 1px; }

/* =========================================================
   HUB LAYOUT
   ========================================================= */
#app { min-height: 100vh; display: flex; flex-direction: column; }

.hub-header {
  padding: 48px 24px 24px;
  text-align: center;
}
.hub-header h1 {
  margin: 0 0 8px;
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent-2), var(--accent-4), var(--accent-1));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hub-header p {
  margin: 0;
  color: var(--fg-dim);
  font-size: clamp(14px, 2vw, 16px);
}

.hub-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  padding: 16px 24px 64px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

.card {
  position: relative;
  padding: 20px;
  border-radius: var(--radius);
  background: var(--bg-glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  transition: all 0.3s var(--ease);
  overflow: hidden;
  min-height: 150px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  font: inherit;
  color: inherit;
  box-shadow: var(--shadow);
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--card-accent, var(--accent-4));
  box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--card-accent, var(--accent-4));
}
.card .icon {
  font-size: 32px;
  margin-bottom: 8px;
  filter: drop-shadow(0 4px 12px var(--card-accent, var(--accent-4)));
}
.card .title {
  font-weight: 700;
  font-size: 16px;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
}
.card .desc {
  font-size: 13px;
  color: var(--fg-dim);
  line-height: 1.45;
  margin: 0;
}
.card .badge {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--card-accent, var(--accent-4));
  color: #0b0b16;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(400px circle at var(--mx,50%) var(--my,50%), var(--card-accent, var(--accent-4))20, transparent 40%);
  opacity: 0;
  transition: opacity 0.4s var(--ease);
  pointer-events: none;
}
.card:hover::before { opacity: 1; }

footer.hub-footer {
  margin-top: auto;
  text-align: center;
  padding: 32px 24px 48px;
  color: var(--fg-dim);
  font-size: 13px;
}
footer.hub-footer a { color: var(--accent-2); text-decoration: none; }
footer.hub-footer a:hover { text-decoration: none; }

/* =========================================================
   EXPERIMENT VIEW
   ========================================================= */
.view {
  position: relative;
  padding: 16px;
  min-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
  animation: fadeIn 0.4s var(--ease);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.view-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 13px;
}
.view-header h2 {
  margin: 0;
  font-size: clamp(18px, 3vw, 24px);
  font-weight: 700;
}
.view-body {
  flex: 1;
  border-radius: var(--radius);
  background: var(--bg-soft);
  border: 1px solid var(--border);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 480px;
}
.controls {
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.25);
}
.controls label { font-size: 12px; color: var(--fg-dim); display: inline-flex; gap: 6px; align-items: center; }
.controls input[type=range] { accent-color: var(--accent-4); width: 120px; }
.stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 400px;
}
.stage canvas { display: block; width: 100%; height: 100%; }

.hint {
  font-size: 12px;
  color: var(--fg-dim);
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}

/* Game-specific overlays */
.overlay-center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  font-size: 28px;
  font-weight: 800;
  pointer-events: none;
}

/* Typing test */
.typing-text { padding: 24px; font-family: var(--mono); font-size: 18px; line-height: 1.8; }
.typing-text .correct { color: var(--accent-7); }
.typing-text .wrong { color: var(--accent-1); background: rgba(255,77,157,0.2); border-radius: 2px; }
.typing-text .cursor { background: var(--accent-4); color: var(--bg); padding: 0 2px; border-radius: 2px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.4; } }

/* 2048 / Snake / Memory */
.grid-game {
  display: grid;
  gap: 8px;
  padding: 16px;
  margin: auto;
}
.tile {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-weight: 700;
  font-size: clamp(14px, 3vw, 24px);
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  aspect-ratio: 1;
  user-select: none;
  touch-action: manipulation;
  transition: transform 0.15s var(--ease);
}
.tile.flipped { background: linear-gradient(135deg, var(--accent-4), var(--accent-1)); }
.tile.matched { background: var(--accent-7); color: #0b0b16; }

/* Poem / Haiku */
.word-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}
.word-chip {
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--bg-glass);
  border: 1px solid var(--border);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.word-chip:hover { background: var(--accent-4); color: #0b0b16; border-color: var(--accent-4); }
.word-chip.used { opacity: 0.3; pointer-events: none; }
.output-box {
  padding: 24px;
  font-size: clamp(16px, 3vw, 22px);
  line-height: 1.7;
  min-height: 200px;
  white-space: pre-wrap;
}

/* Breathing */
.breathe-circle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 60vmin;
  height: 60vmin;
  max-width: 400px;
  max-height: 400px;
  transform: translate(-50%, -50%) scale(0.5);
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-4), var(--accent-1));
  box-shadow: 0 0 80px rgba(124,92,255,0.5);
  transition: transform 4s ease-in-out;
}
.breathe-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 24px;
  font-weight: 700;
  text-shadow: 0 2px 20px rgba(0,0,0,0.8);
}

/* Palette */
.palette-row { display: flex; height: 100%; }
.palette-swatch { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding: 16px; cursor: pointer; font-family: var(--mono); font-size: 12px; color: #0b0b16; font-weight: 700; text-shadow: 0 0 8px rgba(255,255,255,0.6); }

/* Responsive tweaks */
@media (max-width: 640px) {
  .hub-header { padding: 32px 16px 16px; }
  .hub-grid { padding: 12px 12px 48px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { padding: 14px; min-height: 130px; }
  .card .icon { font-size: 26px; }
  .view { padding: 10px; }
  .controls { padding: 10px; gap: 6px; }
  .controls input[type=range] { width: 90px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   RAGA-VIBE · 30 Experiments
   Single-file SPA with hash routing
   ========================================================= */
(() => {
'use strict';

const app = document.getElementById('app');
let currentCleanup = null;

/* -------- Utility functions -------- */
const rand = (a, b) => Math.random() * (b - a) + a;
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

/* Simple value-noise implementation (no external lib) */
const noise2D = (() => {
  const perm = new Uint8Array(512);
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [perm[i], perm[j]] = [perm[j], perm[i]];
  }
  for (let i = 0; i < 256; i++) perm[256 + i] = perm[i];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  const grad = (h, x, y) => {
    const s = h & 3;
    const u = s < 2 ? x : y;
    const v = s < 2 ? y : x;
    return ((s & 1) ? -u : u) + ((s & 2) ? -v : v);
  };
  return (x, y) => {
    const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[perm[xi] + yi], ab = perm[perm[xi] + yi + 1];
    const ba = perm[perm[xi + 1] + yi], bb = perm[perm[xi + 1] + yi + 1];
    return lerp(
      lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u),
      lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u),
      v
    );
  };
})();

/* Resize canvas helper (handles DPR) */
function fitCanvas(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

/* Shared audio context (lazy) */
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur = 0.3, type = 'sine', gain = 0.2) {
  const ac = getAudio();
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(gain, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  osc.connect(g).connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime + dur);
}

/* -------- Experiment Registry -------- */
const experiments = {};

/* =========================================================
   1. FLOW FIELD ART
   ========================================================= */
experiments['flow-field'] = {
  title: 'Flow Field Art', icon: '🌊', badge: 'generative',
  desc: 'Particles trace paths through a noise-based vector field.',
  init(stage) {
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let raf, ctx, w, h;
    const particles = [];
    const N = 400;
    let hue = Math.random() * 360;
    function resize() { ({ ctx, w, h } = fitCanvas(canvas)); ctx.fillStyle = 'rgba(10,10,20,0.1)'; ctx.fillRect(0, 0, w, h); }
    resize();
    window.addEventListener('resize', resize);
    for (let i = 0; i < N; i++) particles.push({ x: rand(0, w), y: rand(0, h) });
    let t = 0;
    function step() {
      ctx.fillStyle = 'rgba(10,10,20,0.04)';
      ctx.fillRect(0, 0, w, h);
      t += 0.003;
      hue = (hue + 0.2) % 360;
      for (const p of particles) {
        const n = noise2D(p.x * 0.003, p.y * 0.003 + t);
        const a = n * Math.PI * 4;
        const vx = Math.cos(a), vy = Math.sin(a);
        p.x += vx * 1.2;
        p.y += vy * 1.2;
        if (p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
          p.x = rand(0, w); p.y = rand(0, h);
        }
        ctx.fillStyle = `hsla(${(hue + p.x * 0.1) % 360}, 80%, 60%, 0.5)`;
        ctx.fillRect(p.x, p.y, 1.5, 1.5);
      }
      raf = requestAnimationFrame(step);
    }
    step();
    const clickHandler = () => { ctx.fillStyle = 'rgba(10,10,20,1)'; ctx.fillRect(0, 0, w, h); };
    canvas.addEventListener('click', clickHandler);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }
};

/* =========================================================
   2. SYNESTHESIA PAINTER
   ========================================================= */
experiments['synesthesia'] = {
  title: 'Synesthesia Painter', icon: '🎨', badge: 'audio',
  desc: 'Draw on the canvas — position maps to pitch, speed to volume.',
  init(stage) {
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let ctx, w, h;
    function resize() { ({ ctx, w, h } = fitCanvas(canvas)); ctx.fillStyle = '#12121f'; ctx.fillRect(0, 0, w, h); }
    resize();
    let drawing = false, last = null, lastTone = 0;
    const notes = [220, 246.94, 261.63, 293.66, 329.63, 349.23, 392, 440, 493.88, 523.25, 587.33, 659.25];
    const pos = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };
    const start = e => { e.preventDefault(); drawing = true; last = pos(e); };
    const move = e => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      const hue = (p.x / w) * 360;
      ctx.strokeStyle = `hsl(${hue}, 85%, 60%)`;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      // Play tone
      const idx = Math.floor((p.y / h) * notes.length);
      const now = performance.now();
      if (now - lastTone > 80) {
        playTone(notes[clamp(idx, 0, notes.length - 1)], 0.2, 'triangle', 0.15);
        lastTone = now;
      }
      last = p;
    };
    const end = () => drawing = false;
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
    window.addEventListener('resize', resize);
    return () => {
      canvas.removeEventListener('mousedown', start);
      canvas.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', end);
      canvas.removeEventListener('touchstart', start);
      canvas.removeEventListener('touchmove', move);
      canvas.removeEventListener('touchend', end);
    };
  }
};

/* =========================================================
   3. RAGA SYNTH
   ========================================================= */
experiments['raga-synth'] = {
  title: 'Raga Synth', icon: '🎹', badge: 'audio',
  desc: 'Tap keys to play a pentatonic scale. Switch scales and octaves.',
  init(stage) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding:20px; overflow:auto; height:100%;';
    wrap.innerHTML = `
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <label>Scale:
          <select id="scaleSel">
            <option value="0,2,4,7,9">Pentatonic Major</option>
            <option value="0,3,5,7,10">Pentatonic Minor</option>
            <option value="0,2,3,5,7,8,10">Bhairav (Raga)</option>
            <option value="0,2,4,6,7,9,11">Whole Tone</option>
            <option value="0,1,4,5,7,8,11">Bhairavi (Raga)</option>
          </select>
        </label>
        <label>Octave: <input id="oct" type="range" min="2" max="6" value="4"></label>
      </div>
      <div id="keys" style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;"></div>
    `;
    stage.appendChild(wrap);
    const keys = $('#keys', wrap);
    function render() {
      const intervals = $('#scaleSel', wrap).value.split(',').map(Number);
      const oct = parseInt($('#oct', wrap).value);
      keys.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const isOn = intervals.includes(i % 12);
        const k = document.createElement('button');
        k.textContent = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][i];
        k.style.cssText = `padding:20px 0;border-radius:8px;font-weight:700;background:${isOn?'linear-gradient(135deg,var(--accent-2),var(--accent-4))':'rgba(255,255,255,0.05)'};color:${isOn?'#0b0b16':'var(--fg-dim)'};border:1px solid var(--border);cursor:pointer;`;
        if (isOn) {
          k.addEventListener('click', () => {
            const freq = 440 * Math.pow(2, (i - 9) / 12 + (oct - 4));
            playTone(freq, 0.8, 'sine', 0.2);
            playTone(freq * 2, 0.6, 'sine', 0.08);
          });
        }
        keys.appendChild(k);
      }
    }
    $('#scaleSel', wrap).addEventListener('change', render);
    $('#oct', wrap).addEventListener('input', render);
    render();
    return () => {};
  }
};

/* =========================================================
   4. GAME OF LIFE
   ========================================================= */
experiments['life'] = {
  title: "Conway's Life", icon: '🧫', badge: 'sim',
  desc: 'Click cells to toggle. Watch emergence unfold.',
  init(stage) {
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let ctx, w, h;
    const CELL = 14;
    let cols, rows, grid, next;
    let running = false, raf;
    function resize() {
      ({ ctx, w, h } = fitCanvas(canvas));
      cols = Math.floor(w / CELL); rows = Math.floor(h / CELL);
      grid = Array.from({length: rows}, () => new Uint8Array(cols));
      next = Array.from({length: rows}, () => new Uint8Array(cols));
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) grid[y][x] = Math.random() < 0.25 ? 1 : 0;
      draw();
    }
    function draw() {
      ctx.fillStyle = '#0a0a14';
      ctx.fillRect(0, 0, w, h);
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x]) {
            ctx.fillStyle = '#00e5c7';
            ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
          }
        }
      }
    }
    function step() {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          let n = 0;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const ny = (y + dy + rows) % rows, nx = (x + dx + cols) % cols;
            n += grid[ny][nx];
          }
          next[y][x] = grid[y][x] ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
        }
      }
      [grid, next] = [next, grid];
      draw();
    }
    function loop() {
      step();
      raf = setTimeout(() => raf = requestAnimationFrame(loop), 80);
    }
    resize();
    window.addEventListener('resize', resize);
    const toggle = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      const x = Math.floor((t.clientX - r.left) / CELL);
      const y = Math.floor((t.clientY - r.top) / CELL);
      if (x >= 0 && x < cols && y >= 0 && y < rows) {
        grid[y][x] ^= 1;
        draw();
      }
    };
    canvas.addEventListener('click', toggle);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); toggle(e); }, { passive: false });
    // Controls
    const ctrl = document.createElement('div');
    ctrl.className = 'controls';
    ctrl.innerHTML = `<button id="pp">▶ Play</button><button id="rst">↻ Randomize</button><button id="clr">⌫ Clear</button>`;
    stage.parentNode.insertBefore(ctrl, stage);
    $('#pp', ctrl).addEventListener('click', e => {
      running = !running;
      e.target.textContent = running ? '⏸ Pause' : '▶ Play';
      if (running) loop(); else { clearTimeout(raf); cancelAnimationFrame(raf); }
    });
    $('#rst', ctrl).addEventListener('click', () => {
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) grid[y][x] = Math.random() < 0.25 ? 1 : 0;
      draw();
    });
    $('#clr', ctrl).addEventListener('click', () => {
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) grid[y][x] = 0;
      draw();
    });
    return () => { cancelAnimationFrame(raf); clearTimeout(raf); };
  }
};

experiments['mandala'] = {
  title: 'Mandala Maker', icon: '🪷', badge: 'generative',
  desc: 'Draw symmetrical radial patterns with touch or mouse.',
  init(stage) {
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let ctx, w, h;
    const SYM = 8;
    function resize() {
      ({ ctx, w, h } = fitCanvas(canvas));
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, w, h);
    }
    resize();
    let drawing = false, last = null;
    const pos = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };
    const start = e => { e.preventDefault(); drawing = true; last = pos(e); };
    const move = e => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      const cx = w / 2, cy = h / 2;
      const hue = (Date.now() / 30) % 360;
      ctx.strokeStyle = `hsl(${hue},80%,60%)`;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (let i = 0; i < SYM; i++) {
        const a = (Math.PI * 2 / SYM) * i;
        const cos = Math.cos(a), sin = Math.sin(a);
        const rx1 = cos * (last.x - cx) - sin * (last.y - cy) + cx;
        const ry1 = sin * (last.x - cx) + cos * (last.y - cy) + cy;
        const rx2 = cos * (p.x - cx) - sin * (p.y - cy) + cx;
        const ry2 = sin * (p.x - cx) + cos * (p.y - cy) + cy;
        ctx.beginPath(); ctx.moveTo(rx1, ry1); ctx.lineTo(rx2, ry2); ctx.stroke();
      }
      last = p;
    };
    const end = () => drawing = false;
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
    window.addEventListener('resize', resize);
    return () => {};
  }
};

    stage.appendChild(wrap);
    const pal = $('#pal', wrap);
    const modes = ['analogous','complementary','triadic','split','random'];
    function hsl2hex(h, s, l) {
      l /= 100;
      const a = s * Math.min(l, 1 - l) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * c).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }
    function generate() {
      const mode = modes[randInt(0, modes.length - 1)];
      const base = rand(0, 360);
      const hues = [];
      if (mode === 'analogous') for (let i = 0; i < 5; i++) hues.push((base + i * 15 - 30) % 360);
      if (mode === 'complementary') hues.push(base, base + 180, base - 30, base + 210, base + 150);
      if (mode === 'triadic') hues.push(base, base + 120, base + 240, base + 60, base + 180);
      if (mode === 'split') hues.push(base, base + 150, base + 210, base + 30, base - 30);
      if (mode === 'random') for (let i = 0; i < 5; i++) hues.push(rand(0, 360));
      pal.innerHTML = '';
      const hexes = [];
      hues.forEach(h => {
        const hex = hsl2hex((h + 360) % 360, 70, 55);

        s.className = 'palette-swatch';

    });

    return () => {};
  }
};

experiments['snake'] = {

        <div></div><button data-d="U">↑</button><div></div>
        <button data-d="L">←</button><button data-d="D">↓</button><button data-d="R">→</button>
      </div>`;
    stage.appendChild(wrap);
    const canvas = $('canvas', wrap);
    let ctx, w, h;
    const CELL = 20;
    let snake, dir, nextDir, food, score, dead, raf, lastStep;
    function resize() { ({ ctx, w, h } = fitCanvas(canvas)); }
    resize();
    window.addEventListener('resize', resize);
    function reset() {
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];

      placeFood();

      $('#sScore').textContent = 'Score: 0';

    function placeFood() {
      const cols = Math.floor(w / CELL), rows = Math.floor(h / CELL);
      food = { x: randInt(0, cols-1), y: randInt(0, rows-1) };
    }
    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const cols = Math.floor(w / CELL), rows = Math.floor(h / CELL);
      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)) {
        dead = true; return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++; $('#sScore').textContent = `Score: ${score}`;
        placeFood();
      } else snake.pop();
    }
    function draw() {
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, w, h);
      const cols = Math.floor(w / CELL), rows = Math.floor(h / CELL);
      ctx.fillStyle = '#ff4d9d';
      ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#00e5c7' : `hsl(${170 + i}, 80%, 55%)`;

        ctx.font = '16px system-ui'; ctx.fillText('Tap Restart', w/2, h/2 + 20);
      }

    function loop(t) {
      if (t - lastStep > 120 && !dead) { step(); lastStep = t; }
      draw();
      raf = requestAnimationFrame(loop);
    }
    const setDir = d => {
      const map = { U: {x:0,y:-1}, D: {x:0,y:1}, L: {x:-1,y:0}, R: {x:1,y:0} };
      const nd = map[d];
      if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;

    const onKey = e => {
      if (e.key === 'ArrowUp') setDir('U');
      else if (e.key === 'ArrowDown') setDir('D');
      else if (e.key === 'ArrowLeft') setDir('L');
      else if (e.key === 'ArrowRight') setDir('R');

      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;

      else setDir(dy > 0 ? 'D' : 'U');

    $('#sRestart', wrap).addEventListener('click', () => { dead = false; reset(); });
    reset();
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('keydown', onKey); };
  }
};

/* =========================================================
   12. BOID FLOCKING

experiments['boids'] = {
  title: 'Boid Flocking', icon: '🐦', badge: 'sim',
  desc: 'Watch emergent flocking behavior.',
  init(stage) {
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let ctx, w, h, raf;
    function resize() { ({ ctx, w, h } = fitCanvas(canvas)); }
    resize();
    window.addEventListener('resize', resize);
    const N = 80;
    const boids = Array.from({length: N}, () => ({
      x: rand(0, w || 800), y: rand(0, h || 600),
      vx: rand(-2, 2), vy: rand(-2, 2)
    }));
    let mouseX = -1, mouseY = -1, attract = false;
    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect(); mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
    });
    canvas.addEventListener('mousedown', () => attract = true);
    canvas.addEventListener('mouseup', () => attract = false);
    canvas.addEventListener('touchstart', e => {
      const r = canvas.getBoundingClientRect(); mouseX = e.touches[0].clientX - r.left; mouseY = e.touches[0].clientY - r.top; attract = true;
    });
    canvas.addEventListener('touchmove', e => {
      const r = canvas.getBoundingClientRect(); mouseX = e.touches[0].clientX - r.left; mouseY = e.touches[0].clientY - r.top;
    });
    canvas.addEventListener('touchend', () => attract = false);
    function step() {
      ctx.fillStyle = 'rgba(10,10,20,0.25)';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < N; i++) {
        const b = boids[i];
        let sx = 0, sy = 0, ax = 0, ay = 0, cx = 0, cy = 0, n = 0;
        for (let j = 0; j < N; j++) {
          if (i === j) continue;
          const o = boids[j];
          const dx = o.x - b.x, dy = o.y - b.y;
          const d = Math.hypot(dx, dy);
          if (d < 80) {
            n++;
            ax += o.vx; ay += o.vy;
            cx += o.x; cy += o.y;
            if (d < 25) { sx -= dx / d; sy -= dy / d; }
          }
        }
        if (n > 0) {
          ax /= n; ay /= n;
          cx = cx / n - b.x; cy = cy / n - b.y;
        }
        b.vx += sx * 0.05 + ax * 0.04 + cx * 0.005;
        b.vy += sy * 0.05 + ay * 0.04 + cy * 0.005;
        if (attract && mouseX >= 0) {
          b.vx += (mouseX - b.x) * 0.0005;
          b.vy += (mouseY - b.y) * 0.0005;
        }
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > 3) { b.vx = b.vx / sp * 3; b.vy = b.vy / sp * 3; }
        b.x += b.vx; b.y += b.vy;
        if (b.x < 0) b.x += w; if (b.x > w) b.x -= w;
        if (b.y < 0) b.y += h; if (b.y > h) b.y -= h;
        const ang = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(ang);
        ctx.fillStyle = `hsl(${(180 + i * 3) % 360}, 80%, 65%)`;
        ctx.beginPath();
        ctx.moveTo(6, 0); ctx.lineTo(-4, -3); ctx.lineTo(-4, 3);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      raf = requestAnimationFrame(step);
    }
    step();
    return () => cancelAnimationFrame(raf);
  }
};

  desc: 'Fly through infinite stars. Tap to warp.',
  init(stage) {
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let ctx, w, h, raf;
    function resize() {
      ({ ctx, w, h } = fitCanvas(canvas));
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    }
    resize();
    window.addEventListener('resize', resize);
    const N = 500;
    const stars = Array.from({length: N}, () => ({
      x: rand(-1, 1), y: rand(-1, 1), z: rand(0.01, 1)
    }));
    let speed = 0.003, warp = 1;
    canvas.addEventListener('mousedown', () => warp = 6);
    canvas.addEventListener('mouseup', () => warp = 1);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); warp = 6; });
    canvas.addEventListener('touchend', () => warp = 1);
    function step() {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2;
      for (const s of stars) {
        s.z -= speed * warp;
        if (s.z <= 0.01) { s.x = rand(-1,1); s.y = rand(-1,1); s.z = 1; }
        const px = (s.x / s.z) * w + cx;
        const py = (s.y / s.z) * h + cy;
        const size = (1 - s.z) * 3;
        const alpha = 1 - s.z;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI*2); ctx.fill();
        if (warp > 1) {
          const trail = (1 - s.z) * 20 * warp;
          const dx = px - cx, dy = py - cy;
          const len = Math.hypot(dx, dy) || 1;
          ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.5})`;
          ctx.lineWidth = size * 0.5;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px - (dx/len) * trail, py - (dy/len) * trail);
          ctx.stroke();
        }
      }
      raf = requestAnimationFrame(step);
    }
    step();
    return () => cancelAnimationFrame(raf);
  }
};

experiments['maze'] = {
  title: 'Maze Solver', icon: '🌀', badge: 'sim',
  desc: 'Generate mazes and watch a BFS solver find the path.',
  init(stage) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;height:100%;';
    wrap.innerHTML = `<div class="controls"><button id="mzGen">New Maze</button><button id="mzSolve">Solve</button></div><canvas style="flex:1;background:#0a0a14;"></canvas>`;
    stage.appendChild(wrap);
    const canvas = $('canvas', wrap);
    let ctx, w, h;
    const CELL = 24;
    let cols, rows, grid;
    function resize() {
      ({ ctx, w, h } = fitCanvas(canvas));
      cols = Math.floor(w / CELL); rows = Math.floor(h / CELL);
    }
    resize();
    window.addEventListener('resize', () => { resize(); draw(); });
    function gen() {
      grid = Array.from({length: rows}, () => Array.from({length: cols}, () => ({ walls: [1,1,1,1], v: false })));
      const stack = [[0,0]];
      grid[0][0].v = true;
      while (stack.length) {
        const [y, x] = stack[stack.length - 1];
        const opts = [];
        if (y > 0 && !grid[y-1][x].v) opts.push([y-1, x, 0, 2]);
        if (x < cols-1 && !grid[y][x+1].v) opts.push([y, x+1, 1, 3]);
        if (y < rows-1 && !grid[y+1][x].v) opts.push([y+1, x, 2, 0]);
        if (x > 0 && !grid[y][x-1].v) opts.push([y, x-1, 3, 1]);
        if (!opts.length) { stack.pop(); continue; }
        const [ny, nx, w1, w2] = opts[randInt(0, opts.length-1)];
        grid[y][x].walls[w1] = 0;
        grid[ny][nx].walls[w2] = 0;
        grid[ny][nx].v = true;
        stack.push([ny, nx]);
      }
    }
    let path = [];
    function solve() {
      const q = [[[0,0]]];
      const seen = new Set(['0,0']);
      const target = [rows-1, cols-1];
      while (q.length) {
        const p = q.shift();
        const [y, x] = p[p.length - 1];
        if (y === target[0] && x === target[1]) { path = p; return; }
        const dirs = [[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];
        for (const [dy, dx, w1] of dirs) {
          const ny = y + dy, nx = x + dx;
          if (ny < 0 || ny >= rows || nx < 0 || nx >= cols) continue;
          if (grid[y][x].walls[w1] === 1) continue;
          const k = `${ny},${nx}`;
          if (seen.has(k)) continue;
          seen.add(k);
          q.push([...p, [ny, nx]]);
        }
      }
    }
    function draw() {
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, w, h);
      if (!grid) return;
      ctx.strokeStyle = '#8a8fb5';
      ctx.lineWidth = 2;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const c = grid[y][x];
          const px = x * CELL, py = y * CELL;
          if (c.walls[0]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + CELL, py); ctx.stroke(); }
          if (c.walls[1]) { ctx.beginPath(); ctx.moveTo(px + CELL, py); ctx.lineTo(px + CELL, py + CELL); ctx.stroke(); }
          if (c.walls[2]) { ctx.beginPath(); ctx.moveTo(px, py + CELL); ctx.lineTo(px + CELL, py + CELL); ctx.stroke(); }
          if (c.walls[3]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + CELL); ctx.stroke(); }
        }
      }
      // Start / end
      ctx.fillStyle = '#00e5c7';
      ctx.fillRect(4, 4, CELL - 8, CELL - 8);
      ctx.fillStyle = '#ff4d9d';
      ctx.fillRect((cols-1) * CELL + 4, (rows-1) * CELL + 4, CELL - 8, CELL - 8);
      // Path
      if (path.length) {
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 4;
        ctx.beginPath();
        path.forEach(([y, x], i) => {
          const px = x * CELL + CELL/2, py = y * CELL + CELL/2;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.stroke();
      }
    }
    $('#mzGen', wrap).addEventListener('click', () => { path = []; gen(); draw(); });
    $('#mzSolve', wrap).addEventListener('click', () => { solve(); draw(); });
    gen(); draw();
    return () => {};
  }
};

      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#d9c9a3'); g.addColorStop(1, '#c2b085');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    const pos = e => { const r = canvas.getBoundingClientRect(); const t = e.touches?.[0] || e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
    const start = e => { e.preventDefault(); last = pos(e); };
    const move = e => {
      if (!last) return;
      e.preventDefault();
      const p = pos(e);
      // draw multiple parallel rake lines
      const dx = p.x - last.x, dy = p.y - last.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      for (let i = -2; i <= 2; i++) {
        ctx.strokeStyle = `rgba(90,70,40,${0.6 - Math.abs(i)*0.1})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(last.x + nx * i * 4, last.y + ny * i * 4);
        ctx.lineTo(p.x + nx * i * 4, p.y + ny * i * 4);
        ctx.stroke();
      }
      last = p;
    };
    const end = () => last = null;
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);

  title: '2048', icon: '🧱', badge: 'game',

    stage.appendChild(wrap);

    const COLORS = { 2:'#3a3a55', 4:'#4a4a70', 8:'#ff8a3d', 16:'#ff6a3d', 32:'#ff4d9d', 64:'#e63946', 128:'#ffd166', 256:'#ffd166', 512:'#ffd166', 1024:'#00e5c7', 2048:'#7c5cff' };
    let board, score;
    function empty() { return Array.from({length: 4}, () => Array(4).fill(0)); }
    function addRandom() {
      const cells = [];
      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (!board[y][x]) cells.push([y,x]);
      if (!cells.length) return;
      const [y, x] = cells[randInt(0, cells.length - 1)];
      board[y][x] = Math.random() < 0.9 ? 2 : 4;
    }
    function render() {
      grid.innerHTML = '';
      for (let y = 0; y < 4; y++) {
        for (let x = 0; x < 4; x++) {
          const v = board[y][x];
          const t = document.createElement('div');
          t.className = 'tile';
          t.textContent = v || '';
          t.style.background = COLORS[v] || 'rgba(255,255,255,0.06)';
          t.style.color = v >= 8 ? '#0b0b16' : '#fff';
          grid.appendChild(t);
        }
      }
      $('#g2Score').textContent = `Score: ${score}`;
    }
    function slide(row) {
      const a = row.filter(x => x);
      for (let i = 0; i < a.length - 1; i++) {
        if (a[i] === a[i+1]) {
          a[i] *= 2; score += a[i]; a.splice(i+1, 1);
        }
      }
      while (a.length < 4) a.push(0);
      return a;
    }
    function move(dir) {
      const old = JSON.stringify(board);
      if (dir === 'L') for (let y = 0; y < 4; y++) board[y] = slide(board[y]);
      if (dir === 'R') for (let y = 0; y < 4; y++) board[y] = slide(board[y].reverse()).reverse();
      if (dir === 'U') {
        for (let x = 0; x < 4; x++) {
          const col = [board[0][x], board[1][x], board[2][x], board[3][x]];
          const nc = slide(col);
          for (let y = 0; y < 4; y++) board[y][x] = nc[y];
        }
      }
      if (dir === 'D') {
        for (let x = 0; x < 4; x++) {
          const col = [board[3][x], board[2][x], board[1][x], board[0][x]];
          const nc = slide(col);
          for (let y = 0; y < 4; y++) board[3 - y][x] = nc[y];
        }
      }
      if (JSON.stringify(board) !== old) { addRandom(); render(); }
    }
    function reset() {
      board = empty(); score = 0;
      addRandom(); addRandom(); render();
    }
    $('#g2Reset').addEventListener('click', reset);
    const onKey = e => {
      const k = e.key;
      if (k === 'ArrowLeft') move('L');
      else if (k === 'ArrowRight') move('R');
      else if (k === 'ArrowUp') move('U');
      else if (k === 'ArrowDown') move('D');
    };
    window.addEventListener('keydown', onKey);
    let ts = null;
    grid.addEventListener('touchstart', e => { ts = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
    grid.addEventListener('touchend', e => {
      if (!ts) return;
      const dx = e.changedTouches[0].clientX - ts.x;
      const dy = e.changedTouches[0].clientY - ts.y;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'R' : 'L');
      else move(dy > 0 ? 'D' : 'U');
      ts = null;
    });
    reset();
    return () => window.removeEventListener('keydown', onKey);
  }
};

experiments['waves'] = {
  title: 'Wave Interference', icon: '🌊', badge: 'sim',
  desc: 'Two wave sources create interference patterns. Tap to move.',
  init(stage) {
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let ctx, w, h, raf;
    const SCALE = 6;
    let cols, rows, imageData;
    function resize() {
      ({ ctx, w, h } = fitCanvas(canvas));
      cols = Math.floor(w / SCALE); rows = Math.floor(h / SCALE);
      imageData = ctx.createImageData(cols, rows);
    }
    resize();
    window.addEventListener('resize', resize);
    const sources = [{x:0.3,y:0.5},{x:0.7,y:0.5}];
    let t = 0;
    const pos = e => { const r = canvas.getBoundingClientRect(); const t = e.touches?.[0] || e; return { x: (t.clientX - r.left)/w, y: (t.clientY - r.top)/h }; };
    canvas.addEventListener('click', e => { const p = pos(e); sources[0] = { x: p.x, y: p.y }; });
    canvas.addEventListener('touchstart', e => { e.preventDefault(); const p = pos(e); sources[0] = { x: p.x, y: p.y }; }, { passive: false });
    function step() {
      t += 0.1;
      const data = imageData.data;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const px = x / cols, py = y / rows;
          let v = 0;
          for (const s of sources) {
            const d = Math.hypot(px - s.x, py - s.y) * 20;
            v += Math.sin(d - t) / (1 + d * 0.2);
          }
          const i = (y * cols + x) * 4;
          const c = (v + 2) / 4;
          data[i] = Math.floor(c * 60 + 20);
          data[i+1] = Math.floor(c * 180 + 30);
          data[i+2] = Math.floor(c * 255);
          data[i+3] = 255;
        }
      }
      // draw imageData to a tiny offscreen canvas then scale
      const off = document.createElement('canvas');
      off.width = cols; off.height = rows;
      off.getContext('2d').putImageData(imageData, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(off, 0, 0, w, h);
      // sources
      ctx.fillStyle = '#ffd166';
      for (const s of sources) { ctx.beginPath(); ctx.arc(s.x * w, s.y * h, 6, 0, Math.PI*2); ctx.fill(); }
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }
};

  init(stage) {

    resize();
    window.addEventListener('resize', resize);
    let t = 0;
    function step() {
      const cx = w/2, cy = h/2;
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, w, h);
      const maxR = Math.min(w, h) * 0.45;
      const rings = 16;
      for (let i = rings; i >= 0; i--) {
        const r = (i / rings) * maxR;
        const hue = (i * 22 + t * 50) % 360;
        ctx.strokeStyle = `hsl(${hue},80%,55%)`;
        ctx.lineWidth = (maxR / rings) * 0.9;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      // rotating radial
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t);
      for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI / 6);
        ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.sin(t*2 + i)*0.1})`;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, maxR, 0, Math.PI / 12);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();
      t += 0.01;
      raf = requestAnimationFrame(step);
    }

  }
};

experiments['sort'] = {
  title: 'Sort Visualizer', icon: '📊', badge: 'data',
  desc: 'Watch bubble, quick, and merge sort work.',
  init(stage) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;height:100%;';
    wrap.innerHTML = `
      <div class="controls">
        <button data-alg="bubble">Bubble</button>
        <button data-alg="quick">Quick</button>
        <button data-alg="merge">Merge</button>
        <button id="sShuffle">Shuffle</button>
        <span id="sStat" style="color:var(--fg-dim);font-size:12px;"></span>
      </div>
      <canvas style="flex:1;background:#0a0a14;"></canvas>`;
    stage.appendChild(wrap);
    const canvas = $('canvas', wrap);
    let ctx, w, h;
    function resize() { ({ ctx, w, h } = fitCanvas(canvas)); }
    resize();
    window.addEventListener('resize', resize);
    const N = 60;
    let arr = [], comps = [], sorted = false, running = false;
    function shuffle() {
      arr = Array.from({length: N}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
      comps = []; sorted = false; draw();
    }
    function draw() {
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, w, h);
      const bw = w / N;
      for (let i = 0; i < N; i++) {
        const bh = (arr[i] / N) * h * 0.95;
        const hue = comps.includes(i) ? 50 : (arr[i] / N) * 280;
        ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
        ctx.fillRect(i * bw + 1, h - bh, bw - 2, bh);
      }
    }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
    async function bubble() {
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N - i - 1; j++) {
          comps = [j, j+1]; draw();
          await delay(15);
          if (arr[j] > arr[j+1]) [arr[j], arr[j+1]] = [arr[j+1], arr[j]];
        }
      }
      comps = []; draw();
    }
    async function quick(l = 0, r = N - 1) {
      if (l >= r) return;
      const pivot = arr[r]; let i = l;
      for (let j = l; j < r; j++) {
        comps = [j, r]; draw();
        await delay(20);
        if (arr[j] < pivot) {
          [arr[i], arr[j]] = [arr[j], arr[i]];
          i++;
        }
      }
      [arr[i], arr[r]] = [arr[r], arr[i]];
      await quick(l, i - 1);
      await quick(i + 1, r);
      if (l === 0 && r === N - 1) { comps = []; draw(); }
    }
    async function merge(l = 0, r = N - 1) {
      if (l >= r) return;
      const m = Math.floor((l + r) / 2);
      await merge(l, m); await merge(m + 1, r);
      const left = arr.slice(l, m + 1), right = arr.slice(m + 1, r + 1);
      let i = 0, j = 0, k = l;
      while (i < left.length && j < right.length) {
        comps = [k]; draw();
        await delay(20);
        if (left[i] <= right[j]) arr[k++] = left[i++];
        else arr[k++] = right[j++];
      }
      while (i < left.length) { arr[k++] = left[i++]; draw(); await delay(10); }
      while (j < right.length) { arr[k++] = right[j++]; draw(); await delay(10); }
      if (l === 0 && r === N - 1) { comps = []; draw(); }
    }
    const runners = { bubble, quick, merge };
    $$('button[data-alg]', wrap).forEach(b => b.addEventListener('click', async () => {
      if (running) return;
      running = true;
      $('#sStat').textContent = `Running ${b.dataset.alg}...`;
      await runners[b.dataset.alg]();
      running = false;
      $('#sStat').textContent = `Done.`;
    }));
    $('#sShuffle').addEventListener('click', shuffle);
    shuffle();
    return () => { running = false; };
  }
};

/* =========================================================
   30. ART CLOCK
   ========================================================= */
experiments['clock'] = {
  title: 'Art Clock', icon: '⏰', badge: 'generative',
  desc: 'A generative timepiece. Each second redraws the moment.',
  init(stage) {
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let ctx, w, h, raf;
    function resize() { ({ ctx, w, h } = fitCanvas(canvas)); }
    resize();
    window.addEventListener('resize', resize);
    function step() {
      const now = new Date();
      const H = now.getHours(), M = now.getMinutes(), S = now.getSeconds(), ms = now.getMilliseconds();
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, w, h);
      const cx = w/2, cy = h/2;
      const r = Math.min(w, h) * 0.4;
      // hour rings
      for (let i = 0; i < 60; i++) {
        const ang = (i / 60) * Math.PI * 2 - Math.PI/2;
        const rr = r * (0.6 + (i < S ? 0.4 : 0));
        ctx.strokeStyle = i < S ? `hsl(${i*6},80%,60%)` : 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, rr, ang, ang + Math.PI/30);
        ctx.stroke();
      }
      // hands
      const drawHand = (val, max, len, color, width) => {
        const ang = (val / max) * Math.PI * 2 - Math.PI/2;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len);
        ctx.stroke();
      };
      drawHand(H % 12 + M / 60, 12, r * 0.5, '#ffd166', 6);
      drawHand(M + S / 60, 60, r * 0.75, '#00e5c7', 4);
      drawHand(S + ms / 1000, 60, r * 0.9, '#ff4d9d', 2);
      // digital
      ctx.fillStyle = '#e9ecff';
      ctx.font = 'bold 20px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(now.toLocaleTimeString(), cx, cy + r + 40);
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }
};

/* -------- Router / View Management -------- */
const CATEGORY_COLORS = {
  'generative': 'var(--accent-1)',
  'audio': 'var(--accent-2)',
  'game': 'var(--accent-3)',
  'ambient': 'var(--accent-4)',
  'sim': 'var(--accent-5)',
  'data': 'var(--accent-6)',
  'text': 'var(--accent-7)',
};
const CATEGORY_LABELS = {
  'generative': 'ART', 'audio': 'AUDIO', 'game': 'GAME',
  'ambient': 'ZEN', 'sim': 'SIM', 'data': 'DATA', 'text': 'TEXT'
};

function renderHub() {
  const header = `
    <header class="hub-header">
      <h1>Raga-Vibe</h1>
      <p>30 creative experiments · one file · zero dependencies</p>
      <p>this is a test for <span style="color: purple; font-style: italic;">Qwen3.8-Plus</span></p>
    </header>`;
  const cards = Object.entries(experiments).map(([slug, e]) => `
    <a href="#/${slug}" class="card" style="--card-accent:${CATEGORY_COLORS[e.badge]};" data-slug="${slug}">
      <span class="badge">${CATEGORY_LABELS[e.badge]}</span>
      <div class="icon">${e.icon}</div>
      <div>
        <p class="title">${e.title}</p>
        <p class="desc">${e.desc}</p>
      </div>
    </a>`).join('');
  const footer = `
    <footer class="hub-footer">
      Built with care by <a href="https://github.com/Raga-Vibe" target="_blank" rel="noopener">Raga-Vibe</a>
      &nbsp;·&nbsp; <a href="https://x.com/RagaCrypt" target="_blank" rel="noopener">@RagaCrypt</a>
      <br>
      <span style="font-size:11px;opacity:0.7;">v1.0 · 30 experiments · single-file SPA</span>
    </footer>`;
  app.innerHTML = header + `<main class="hub-grid">${cards}</main>` + footer;

  // Card glow-follow effect
  $$('.card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', `${e.clientX - r.left}px`);
      card.style.setProperty('--my', `${e.clientY - r.top}px`);
    });
  });
}

function renderExperiment(slug) {
  const exp = experiments[slug];
  if (!exp) { location.hash = ''; return; }
  app.innerHTML = `
    <section class="view">
      <div class="view-header">
        <button class="back-btn" id="backBtn">← Back</button>
        <h2>${exp.icon} ${exp.title}</h2>
        <span style="font-size:12px;padding:4px 10px;border-radius:999px;background:${CATEGORY_COLORS[exp.badge]};color:#0b0b16;font-weight:700;">${CATEGORY_LABELS[exp.badge]}</span>
      </div>
      <div class="view-body">
        <div class="stage" id="stage"></div>
        <div class="hint">${exp.desc}</div>
      </div>
    </section>`;
  $('#backBtn').addEventListener('click', () => { location.hash = ''; });
  try {
    currentCleanup = exp.init($('#stage'));
  } catch (err) {
    console.error(err);
    $('#stage').innerHTML = `<div style="padding:20px;color:#ff4d9d;">Error: ${err.message}</div>`;
  }
}

function route() {
  if (currentCleanup) { try { currentCleanup(); } catch(e){} currentCleanup = null; }
  const hash = location.hash;
  if (hash.startsWith('#/')) {
    const slug = hash.slice(2);
    renderExperiment(slug);
  } else {
    renderHub();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('hashchange', route);
// First load
route();

})();
</script>
